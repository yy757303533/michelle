## LiteLLM proxy config for Michelle
##
## Why this exists:
##   Michelle's executor pipeline drives `claude` CLI which always sends
##   `thinking: {type: enabled}` for Opus models. Flywheel's Anthropic-native
##   endpoint (/v1/messages) rejects that field for claude-opus-4-7 ("use
##   thinking.adaptive"), and even on 4-6 it intermittently routes long
##   conversations through an OpenAI-shape backend mid-session, breaking
##   tool_use. We pivot every model call through LiteLLM running locally:
##
##     claude CLI ──Anthropic /v1/messages──▶ LiteLLM (localhost:4000)
##                                                  │ drops `thinking`
##                                                  │ Anthropic ↔ OpenAI translate
##                                                  ▼
##                                       Flywheel /v1/chat/completions
##
##   Bonus: future GLM/Qwen/DeepSeek/Kimi providers slot in here as
##   additional model entries / fallbacks; Michelle code stays unchanged.

model_list:
  # Primary: Flywheel-hosted Opus 4.7 via OpenAI-compat endpoint.
  # The CLI sends model="claude-opus-4-7"; LiteLLM rewrites to openai/...
  - model_name: claude-opus-4-7
    litellm_params:
      model: openai/claude-opus-4-7
      api_base: https://flywheel.zstack.io/v1
      api_key: os.environ/FLYWHEEL_TOKEN
      drop_params: true
      timeout: 180

  # Bare alias also accepted (some callers may strip the "claude-" prefix).
  - model_name: opus
    litellm_params:
      model: openai/claude-opus-4-7
      api_base: https://flywheel.zstack.io/v1
      api_key: os.environ/FLYWHEEL_TOKEN
      drop_params: true
      timeout: 180

  # Secondary: GPT-5.5 on Flywheel for non-Anthropic-shape callers.
  - model_name: gpt-5-5
    litellm_params:
      model: openai/gpt-5-5
      api_base: https://flywheel.zstack.io/v1
      api_key: os.environ/FLYWHEEL_TOKEN
      drop_params: true
      timeout: 180

  # ── Future model slots (uncomment when API keys are provisioned) ──
  # - model_name: claude-opus-4-7   # extra fallback under the same alias
  #   litellm_params:
  #     model: dashscope/qwen3-max
  #     api_key: os.environ/DASHSCOPE_API_KEY
  #     drop_params: true
  # - model_name: claude-opus-4-7
  #   litellm_params:
  #     model: deepseek/deepseek-chat
  #     api_key: os.environ/DEEPSEEK_API_KEY
  #     drop_params: true

litellm_settings:
  drop_params: true
  num_retries: 1
  request_timeout: 180
  set_verbose: false
  json_logs: true

general_settings:
  master_key: sk-michelle-litellm-local
  database_connection_pool_limit: 10

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 1
  retry_after: 2
  # When fallbacks are configured, LiteLLM tries them in order on errors.
  # fallbacks:
  #   - claude-opus-4-7: ["gpt-5-5"]
