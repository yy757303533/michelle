name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: backend tests + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: pin python
        run: uv python install 3.12

      - name: install deps
        run: uv sync --all-extras

      - name: ruff lint
        run: uv run ruff check .

      - name: ruff format check
        run: uv run ruff format --check .

      - name: pytest (unit only)
        run: uv run pytest tests/unit -q
        env:
          # No real LLM keys in CI — every unit test mocks them.
          MINIMAX_API_KEY: ""
          FLYWHEEL_TOKEN: ""
          LOGFIRE_TOKEN: ""

  frontend:
    name: frontend typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: install
        run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm exec tsc -b

      - name: frontend tests
        run: pnpm test --run

      - name: frontend lint gate
        run: pnpm lint

      - name: build
        run: pnpm build
